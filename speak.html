<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#e5e3dc" />
  <link rel="icon" type="image/svg+xml" href="Assets/Logos/Asset%2013.svg" />
  <title>Naiva · Speak — Project: Birdsong</title>
  <meta name="description" content="Hold the emblem and speak: Naiva answers in birdsong. Project: Birdsong by Morsis." />

  <!-- the same room as the site's first page: up from the first paint -->
  <script>document.documentElement.classList.add('js', 'is-gated');</script>

  <link rel="stylesheet" href="styles/fonts.css" />
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body>

  <!-- film grain, as on the site -->
  <canvas id="grain" aria-hidden="true"></canvas>

  <!-- ============ SPEAK · Naiva's push-to-speak page, opened from the engine's Record button ============
       Same room and behaviour as the gate on index.html; only the way out differs: Go back → the engine. -->
  <div class="gate" id="gate" data-mode="return" role="main" aria-label="Naiva — push to speak">
    <span class="gate__logo" role="img" aria-label="Morsis">
      <span class="logo logo--wordmark wordmark__letters"></span><span class="logo logo--emblem wordmark__o"></span>
    </span>
    <div class="gate__stage" role="button" tabindex="0" aria-label="Hold to speak. Release to hear it as birdsong.">
      <span class="gate__shadow" aria-hidden="true"></span>
      <canvas class="gate__form" id="gateForm" aria-hidden="true"></canvas>
      <span class="gate__flat logo logo--emblem" aria-hidden="true"></span>
    </div>
    <p class="gate__say" id="gateSay" aria-live="polite"><i aria-hidden="true"></i><span>Press and hold the emblem to speak</span></p>
    <button class="gate__enter" id="gateEnter" type="button" data-href="index.html?return=engine">
      <span class="gate__enter-arrow gate__enter-arrow--back" aria-hidden="true">←</span>
      <span class="gate__enter-label">Go back</span>
    </button>
  </div>

  <script src="scripts/audio.js" defer></script>
  <script src="scripts/speak.js" defer></script>
  <script src="scripts/gate.js" defer></script>
  <script src="scripts/main.js" defer></script>
</body>
</html>
